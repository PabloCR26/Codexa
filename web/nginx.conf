server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Fallback de SPA: el enrutamiento vive en el cliente, asi que cualquier
  # ruta desconocida debe devolver index.html. Sin esto, recargar la pagina
  # en /automations responde 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Las peticiones a la API se reenvian al contenedor `api`, de modo que el
  # navegador ve un solo origen y la cookie de sesion viaja sin CORS.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
